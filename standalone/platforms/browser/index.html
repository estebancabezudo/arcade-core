<!doctype html>
<!-- Architecture and design
     The standalone page loads only same-origin external scripts and styles. The
     runtime's explicit stylesheetHref selects the CSP-safe Shadow DOM path. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Pac-Man | arcade-core</title>
  <link rel="stylesheet" href="../../../build/standalone/browser/pacman-page.css">
</head>
<body>
  <div id="game"></div>
  <p id="load-error" class="error" role="alert" hidden>
    No se pudo cargar Pac-Man. Ejecuta <code>make pacman-web</code> desde la raíz
    del proyecto y vuelve a abrir esta página.
  </p>
  <noscript><p class="error">Activa JavaScript para ejecutar Pac-Man.</p></noscript>
  <script src="../../../build/standalone/browser/pacman-page.js" defer></script>
  <script id="pacman-bundle" src="../../../build/standalone/browser/pacman.js" charset="utf-8" defer></script>
</body>
</html>
